name: Portfolio Release Gate

on:
  push:
    branches:
      - fix/portfolio-release-2026-10-22
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d8d2923c60cf9c24a0d48a24f84
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify content, routes, lint, types and production build
        run: npm run verify

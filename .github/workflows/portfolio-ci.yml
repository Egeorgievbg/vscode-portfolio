name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/full-evgeni-portfolio]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate portfolio content
        run: npm run content:validate

      - name: Build
        env:
          NEXT_PUBLIC_GITHUB_USERNAME: Egeorgievbg
        run: npm run build
